spring:
  application:
    name: veterinary-app

  config:
    import: optional:file:.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:veterinary}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    # Controllers map lazy associations after the service returns; keep the session open until they are fetched explicitly.
    open-in-view: true

  mvc:
    problemdetails:
      enabled: true
